<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BloomToDeath</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --intro-bg: #000;
      --intro-fg: rgba(255, 255, 255, 0.92);
      --intro-border: rgba(255, 255, 255, 0.16);
      --intro-shadow: rgba(0, 0, 0, 0.48);
      --intro-card-bg: rgba(14, 14, 16, 0.72);
      --intro-card-border: rgba(255, 255, 255, 0.12);
      --intro-card-glow: rgba(255, 255, 255, 0.08);
      --intro-card-copy: rgba(255, 255, 255, 0.96);
      --handoff-fade-duration: 220ms;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--intro-bg);
      color: var(--intro-fg);
    }

    body {
      position: relative;
      font-family: "Space Mono", "IBM Plex Mono", Consolas, Menlo, monospace;
    }

    .handoff-frame-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity var(--handoff-fade-duration) ease,
        visibility 0s linear var(--handoff-fade-duration);
      background: #000;
    }

    .handoff-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .intro-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 3;
      opacity: 1;
      transition: opacity var(--handoff-fade-duration) ease;
    }

    .intro-ascii-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: opacity var(--handoff-fade-duration) ease;
    }

    .intro-video.is-ready {
      opacity: 1;
    }

    .intro-video.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .intro-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: 1;
      transition: opacity var(--handoff-fade-duration) ease;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.24)),
        linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.28));
    }

    .intro-start-wrap {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 48%, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.44) 72%),
        rgba(8, 8, 10, 0.28);
      backdrop-filter: blur(20px) saturate(115%);
      -webkit-backdrop-filter: blur(20px) saturate(115%);
      z-index: 5;
    }

    .intro-start-wrap.is-visible {
      display: flex;
    }

    .intro-start-button {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 52%, rgba(255, 255, 255, 0.025), transparent 26%),
        linear-gradient(180deg, rgba(18, 18, 22, 0.34), rgba(4, 4, 6, 0.54)),
        var(--intro-card-bg);
      color: var(--intro-fg);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      overflow: hidden;
      isolation: isolate;
      text-align: center;
      place-items: center;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    .intro-start-button::before,
    .intro-start-button::after {
      content: "";
      position: absolute;
      inset: auto;
      pointer-events: none;
      z-index: -1;
    }

    .intro-start-button::before {
      inset: -8% -4%;
      background:
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.4), transparent 22%),
        radial-gradient(circle at 33% 58%, rgba(255, 255, 255, 0.065), transparent 22%),
        radial-gradient(circle at 66% 44%, rgba(255, 255, 255, 0.05), transparent 20%),
        radial-gradient(circle at 52% 70%, rgba(255, 255, 255, 0.04), transparent 18%);
      filter: blur(48px);
      opacity: 1;
    }

    .intro-start-button::after {
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.018), rgba(255, 255, 255, 0)),
        radial-gradient(circle at 50% 32%, rgba(255, 255, 255, 0.028), transparent 30%);
      opacity: 1;
    }

    .intro-start-button:hover,
    .intro-start-button:focus-visible {
      transform: scale(1.002);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.045);
      outline: none;
    }

    .intro-start-card-message {
      max-width: 19ch;
      color: var(--intro-card-copy);
      font:
        700
        clamp(28px, 3vw, 44px)
        / 1.08
        "Space Mono",
        "IBM Plex Mono",
        Consolas,
        Menlo,
        monospace;
      letter-spacing: 0.02em;
      text-wrap: balance;
      text-shadow:
        0 0 28px rgba(255, 255, 255, 0.08),
        0 1px 1px rgba(0, 0, 0, 0.32);
    }

    @media (max-width: 640px) {
      .intro-start-button {
        padding: 24px;
      }
    }

    body.is-handoff-visible .handoff-frame-wrap,
    body.is-handoff-complete .handoff-frame-wrap {
      opacity: 1;
      visibility: visible;
      transition-delay: 0s;
    }

    body.is-handoff-complete .handoff-frame-wrap {
      pointer-events: auto;
    }

    body.is-handoff-visible .intro-video {
      opacity: 0.16;
    }

    body.is-intro-ascii-active .intro-video {
      opacity: 0;
    }

    body.is-intro-ascii-active .intro-ascii-canvas {
      opacity: 1;
    }

    body.is-handoff-visible.is-intro-ascii-active .intro-ascii-canvas {
      opacity: 0.16;
    }

    body.is-handoff-visible .intro-overlay {
      opacity: 0.22;
    }

    body.is-handoff-complete .intro-ascii-canvas {
      opacity: 0;
    }

    body.is-handoff-complete .intro-overlay,
    body.is-handoff-complete .intro-start-wrap {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="handoffFrameWrap" class="handoff-frame-wrap" aria-hidden="true">
    <iframe
      id="handoffFrame"
      class="handoff-frame"
      title="Josie"
      loading="eager"
      allow="autoplay"
      referrerpolicy="same-origin"
    ></iframe>
  </div>
  <video id="introVideo" class="intro-video" playsinline preload="auto"></video>
  <canvas id="asciiCanvas" class="intro-ascii-canvas" aria-hidden="true" hidden></canvas>
  <div id="introOverlay" class="intro-overlay" aria-hidden="true"></div>
  <div id="introStartWrap" class="intro-start-wrap" aria-live="polite">
    <button
      id="introStartButton"
      class="intro-start-button"
      type="button"
      aria-label="Start intro audio. This user is a cat; therefore meow."
    >
      <span class="intro-start-card-message">This user is a cat; therefore meow.</span>
    </button>
  </div>

  <script src="/interaction-sfx.js?v=20260329-josie-102"></script>
  <script>
    (() => {
      const mobileIntroBypassMaxWidthPx = 820;
      const handoffLeadSeconds = 0;
      const introAsciiLeadSeconds = 4;
      const introEndHandoffDelayMs = 180;
      const introAsciiChars = ".:-=+*#%@";
      const introAsciiBayer4 = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5]
      ];
      const introAsciiBaseCellSize = 7;
      const introAsciiWideCellSize = 9;
      const introAsciiUltraWideCellSize = 10;
      const introAsciiGlyphScale = 1.08;
      const introAsciiMaxDpr = 1;
      const introAsciiMaxCols = 180;
      const introAsciiMaxRows = 92;
      const repeatVisitHandoffDelayMs = 160;
      const introSeenStorageKey = "internetAngelBloomToDeathIntroSeen";
      const introVideoPath = "Timelapse/Egrets Orchard.mov";
      const introReadyMessageType = "josie-handoff-ready";
      const introCompleteMessageType = "josie-handoff-complete";
      const introVideo = document.getElementById("introVideo");
      const asciiCanvas = document.getElementById("asciiCanvas");
      const introOverlay = document.getElementById("introOverlay");
      const introStartWrap = document.getElementById("introStartWrap");
      const introStartButton = document.getElementById("introStartButton");
      const handoffFrameWrap = document.getElementById("handoffFrameWrap");
      const handoffFrame = document.getElementById("handoffFrame");
      const interactionSfx = window.__createInternetAngelInteractionSfx?.({
        page: "intro"
      }) || null;
      window.__internetAngelInteractionSfx = interactionSfx;
      let introStarted = false;
      let iframePreloading = false;
      let iframeReady = false;
      let handoffVisible = false;
      let handoffCompleted = false;
      let fallbackNavigationTriggered = false;
      let repeatVisitMode = false;
      let skipMovieMode = false;
      let repeatVisitClickArmed = false;
      let repeatVisitHandoffTimer = 0;
      let introEndHandoffTimer = 0;
      let state = "idle";
      let monitorRafId = 0;
      let introAsciiActive = false;
      let introAsciiRafId = 0;
      let introAsciiVideoFrameId = 0;
      let introAsciiViewportW = 0;
      let introAsciiViewportH = 0;
      let introAsciiDpr = Math.max(1, window.devicePixelRatio || 1);
      let introAsciiCols = 0;
      let introAsciiRows = 0;
      let introAsciiCellW = introAsciiBaseCellSize;
      let introAsciiCellH = Math.round(introAsciiBaseCellSize * 1.32);
      let introAsciiFont = "";
      let introAsciiLumBuffer = new Float32Array(0);
      let introAsciiAlphaBuffer = new Uint8Array(0);
      const introAsciiCtx = asciiCanvas instanceof HTMLCanvasElement ? asciiCanvas.getContext("2d", { alpha: true, desynchronized: true }) : null;
      const introAsciiSampleCanvas = document.createElement("canvas");
      const introAsciiSampleCtx = introAsciiSampleCanvas.getContext("2d", { willReadFrequently: true });
      const introAsciiFillCache = new Map();

      function setState(nextState) {
        state = nextState;
        window.__bloomToDeathState = nextState;
        document.body.dataset.bloomToDeathState = nextState;
      }

      function shouldSkipIntro() {
        if (typeof window === "undefined") return false;
        const mobileMatch = window.matchMedia?.(`(max-width: ${mobileIntroBypassMaxWidthPx}px)`)?.matches;
        const coarsePointerMatch = window.matchMedia?.("(pointer: coarse)")?.matches;
        return Boolean(mobileMatch || coarsePointerMatch || window.innerWidth <= mobileIntroBypassMaxWidthPx);
      }

      function resolveJosieDisplayPath() {
        return "/josie";
      }

      function resolveJosieDocumentPath() {
        const isProductionDomain = /(^|\\.)internet-angel\\.net$/i.test(window.location.hostname);
        return isProductionDomain ? "/josie" : "/josie.html";
      }

      function resolveJosieUrl() {
        return new URL(resolveJosieDisplayPath(), window.location.origin);
      }

      function resolveJosieDocumentUrl() {
        return new URL(resolveJosieDocumentPath(), window.location.origin);
      }

      function resolveJosieHandoffUrl() {
        const url = resolveJosieDocumentUrl();
        url.searchParams.set("handoff", "1");
        return url;
      }

      function hasSeenIntroBefore() {
        try {
          return window.localStorage.getItem(introSeenStorageKey) === "1";
        } catch {
          return false;
        }
      }

      function markIntroAsSeen() {
        try {
          window.localStorage.setItem(introSeenStorageKey, "1");
        } catch {
        }
      }

      function clearMonitorLoop() {
        if (!monitorRafId) return;
        window.cancelAnimationFrame(monitorRafId);
        monitorRafId = 0;
      }

      function clearRepeatVisitTimer() {
        if (!repeatVisitHandoffTimer) return;
        window.clearTimeout(repeatVisitHandoffTimer);
        repeatVisitHandoffTimer = 0;
      }

      function clearIntroEndHandoffTimer() {
        if (!introEndHandoffTimer) return;
        window.clearTimeout(introEndHandoffTimer);
        introEndHandoffTimer = 0;
      }

      function clamp01(value) {
        if (value < 0) return 0;
        if (value > 1) return 1;
        return value;
      }

      function getIntroViewportSize() {
        if (window.visualViewport) {
          return {
            width: Math.max(1, Math.round(window.visualViewport.width)),
            height: Math.max(1, Math.round(window.visualViewport.height))
          };
        }
        return {
          width: Math.max(1, window.innerWidth),
          height: Math.max(1, window.innerHeight)
        };
      }

      function getIntroAsciiFillStyle(r, g, b) {
        const rq = r & 0xf8;
        const gq = g & 0xf8;
        const bq = b & 0xf8;
        const key = (rq << 16) | (gq << 8) | bq;
        let style = introAsciiFillCache.get(key);
        if (!style) {
          style = `rgb(${rq} ${gq} ${bq})`;
          introAsciiFillCache.set(key, style);
        }
        return style;
      }

      function resolveIntroAsciiCellSize(viewportWidth, viewportHeight) {
        let baseCellSize = introAsciiBaseCellSize;
        if (viewportWidth >= 1800) {
          baseCellSize = introAsciiUltraWideCellSize;
        } else if (viewportWidth >= 1400) {
          baseCellSize = introAsciiWideCellSize;
        }
        const widthBound = Math.ceil(viewportWidth / introAsciiMaxCols);
        const heightBound = Math.ceil(viewportHeight / (introAsciiMaxRows * 1.32));
        return Math.max(baseCellSize, widthBound, heightBound);
      }

      function configureIntroAsciiCanvas(force = false) {
        if (!(asciiCanvas instanceof HTMLCanvasElement) || !introAsciiCtx || !introAsciiSampleCtx) return;
        const viewport = getIntroViewportSize();
        const nextW = viewport.width;
        const nextH = viewport.height;
        const nextDpr = Math.min(introAsciiMaxDpr, Math.max(1, window.devicePixelRatio || 1));
        const nextCellW = resolveIntroAsciiCellSize(nextW, nextH);
        const nextCellH = Math.round(nextCellW * 1.32);
        const nextCols = Math.max(2, Math.floor(nextW / nextCellW));
        const nextRows = Math.max(2, Math.floor(nextH / nextCellH));
        if (
          !force
          && nextW === introAsciiViewportW
          && nextH === introAsciiViewportH
          && nextDpr === introAsciiDpr
          && nextCellW === introAsciiCellW
          && nextCellH === introAsciiCellH
        ) {
          return;
        }
        introAsciiViewportW = nextW;
        introAsciiViewportH = nextH;
        introAsciiDpr = nextDpr;
        asciiCanvas.width = Math.max(1, Math.floor(introAsciiViewportW * introAsciiDpr));
        asciiCanvas.height = Math.max(1, Math.floor(introAsciiViewportH * introAsciiDpr));
        asciiCanvas.style.width = `${introAsciiViewportW}px`;
        asciiCanvas.style.height = `${introAsciiViewportH}px`;
        introAsciiCtx.setTransform(introAsciiDpr, 0, 0, introAsciiDpr, 0, 0);
        introAsciiCtx.textBaseline = "top";
        introAsciiCtx.textAlign = "left";
        introAsciiCtx.imageSmoothingEnabled = false;
        introAsciiCellW = nextCellW;
        introAsciiCellH = nextCellH;
        introAsciiCols = nextCols;
        introAsciiRows = nextRows;
        introAsciiFont = `700 ${Math.round(introAsciiCellW * introAsciiGlyphScale)}px "Space Mono", "IBM Plex Mono", Consolas, Menlo, monospace`;
        introAsciiCtx.font = introAsciiFont;
        const bufferSize = introAsciiCols * introAsciiRows;
        if (introAsciiLumBuffer.length !== bufferSize) {
          introAsciiLumBuffer = new Float32Array(bufferSize);
          introAsciiAlphaBuffer = new Uint8Array(bufferSize);
        }
        introAsciiSampleCanvas.width = introAsciiCols;
        introAsciiSampleCanvas.height = introAsciiRows;
        introAsciiSampleCtx.setTransform(1, 0, 0, 1, 0, 0);
        introAsciiSampleCtx.imageSmoothingEnabled = false;
      }

      function renderIntroAsciiFrame() {
        if (!(introVideo instanceof HTMLVideoElement) || !introAsciiCtx || !introAsciiSampleCtx) return;
        if (!introAsciiCols || !introAsciiRows) return;
        introAsciiSampleCtx.drawImage(introVideo, 0, 0, introAsciiCols, introAsciiRows);
        const frame = introAsciiSampleCtx.getImageData(0, 0, introAsciiCols, introAsciiRows);
        const data = frame.data;
        const size = introAsciiCols * introAsciiRows;
        const lum = introAsciiLumBuffer;
        const alpha = introAsciiAlphaBuffer;
        for (let index = 0, pixelIndex = 0; index < size; index += 1, pixelIndex += 4) {
          const r = data[pixelIndex];
          const g = data[pixelIndex + 1];
          const b = data[pixelIndex + 2];
          const a = data[pixelIndex + 3];
          alpha[index] = a;
          let y = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
          y = clamp01((y - 0.5) * 1.45 + 0.5);
          y = Math.pow(y, 0.92);
          lum[index] = y;
        }
        introAsciiCtx.clearRect(0, 0, introAsciiViewportW, introAsciiViewportH);
        introAsciiCtx.globalAlpha = 1;
        const densityMax = introAsciiChars.length - 1;
        const edgeStrength = 0.46;
        const ditherStrength = 0.08;
        let lastFillStyle = "";
        for (let y = 0; y < introAsciiRows; y += 1) {
          const yBase = y * introAsciiCols;
          const py = y * introAsciiCellH;
          for (let x = 0; x < introAsciiCols; x += 1) {
            const index = yBase + x;
            if (alpha[index] < 8) continue;
            const l = lum[index];
            const left = x > 0 ? lum[index - 1] : l;
            const right = x < introAsciiCols - 1 ? lum[index + 1] : l;
            const up = y > 0 ? lum[index - introAsciiCols] : l;
            const down = y < introAsciiRows - 1 ? lum[index + introAsciiCols] : l;
            const edge = Math.abs(right - left) + Math.abs(down - up);
            const dither = (introAsciiBayer4[y & 3][x & 3] / 15 - 0.5) * ditherStrength;
            const signal = clamp01(l * 0.9 + edge * edgeStrength + 0.08 + dither);
            const charIndex = Math.min(densityMax, Math.max(0, Math.floor(signal * densityMax)));
            const ch = introAsciiChars[charIndex];
            if (ch === " ") continue;
            const pixelIndex = index * 4;
            const alphaScale = alpha[index] / 255;
            const fillStyle = getIntroAsciiFillStyle(
              Math.round(data[pixelIndex] * alphaScale),
              Math.round(data[pixelIndex + 1] * alphaScale),
              Math.round(data[pixelIndex + 2] * alphaScale)
            );
            if (fillStyle !== lastFillStyle) {
              introAsciiCtx.fillStyle = fillStyle;
              lastFillStyle = fillStyle;
            }
            introAsciiCtx.fillText(ch, x * introAsciiCellW, py);
          }
        }
      }

      function stopIntroAscii() {
        introAsciiActive = false;
        document.body.classList.remove("is-intro-ascii-active");
        if (introAsciiRafId) {
          window.cancelAnimationFrame(introAsciiRafId);
          introAsciiRafId = 0;
        }
        if (introAsciiVideoFrameId && introVideo instanceof HTMLVideoElement && typeof introVideo.cancelVideoFrameCallback === "function") {
          try {
            introVideo.cancelVideoFrameCallback(introAsciiVideoFrameId);
          } catch {
          }
          introAsciiVideoFrameId = 0;
        }
        if (introAsciiCtx) {
          introAsciiCtx.clearRect(0, 0, introAsciiViewportW, introAsciiViewportH);
        }
        if (asciiCanvas instanceof HTMLCanvasElement) {
          asciiCanvas.hidden = true;
        }
      }

      function queueIntroAsciiFrame() {
        if (!introAsciiActive || !(introVideo instanceof HTMLVideoElement) || !introAsciiCtx || !introAsciiSampleCtx) {
          return;
        }
        if (typeof introVideo.requestVideoFrameCallback === "function") {
          introAsciiVideoFrameId = introVideo.requestVideoFrameCallback(() => {
            introAsciiVideoFrameId = 0;
            if (!introAsciiActive || document.hidden) {
              queueIntroAsciiFrame();
              return;
            }
            if (introVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
              configureIntroAsciiCanvas();
              renderIntroAsciiFrame();
            }
            queueIntroAsciiFrame();
          });
          return;
        }
        introAsciiRafId = window.requestAnimationFrame(renderIntroAsciiLoop);
      }

      function renderIntroAsciiLoop() {
        introAsciiRafId = 0;
        if (!introAsciiActive || !(introVideo instanceof HTMLVideoElement) || !introAsciiCtx || !introAsciiSampleCtx) {
          return;
        }
        queueIntroAsciiFrame();
        if (document.hidden) return;
        if (introVideo.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
        configureIntroAsciiCanvas();
        renderIntroAsciiFrame();
      }

      function startIntroAscii() {
        if (introAsciiActive || !(asciiCanvas instanceof HTMLCanvasElement) || !introAsciiCtx || !introAsciiSampleCtx) return;
        introAsciiActive = true;
        asciiCanvas.hidden = false;
        document.body.classList.add("is-intro-ascii-active");
        configureIntroAsciiCanvas(true);
        renderIntroAsciiFrame();
        queueIntroAsciiFrame();
      }

      function isIntroAsciiWindowOpen() {
        if (skipMovieMode || !(introVideo instanceof HTMLVideoElement)) return false;
        if (!Number.isFinite(introVideo.duration) || introVideo.duration <= 0) return false;
        if (introVideo.ended) return false;
        return introVideo.currentTime >= Math.max(0, introVideo.duration - introAsciiLeadSeconds);
      }

      function syncIntroAsciiState() {
        if (isIntroAsciiWindowOpen()) {
          startIntroAscii();
          return;
        }
        stopIntroAscii();
      }

      function showStartButton() {
        introStartWrap?.classList.add("is-visible");
      }

      function hideStartButton() {
        introStartWrap?.classList.remove("is-visible");
      }

      function updateTopLevelUrlForJosie() {
        const url = resolveJosieUrl();
        window.history.replaceState({}, "", `${url.pathname}${url.search}${url.hash}`);
        document.title = "Josie";
      }

      function preloadJosieFrame() {
        if (!(handoffFrame instanceof HTMLIFrameElement)) return;
        if (iframePreloading) return;
        iframePreloading = true;
        setState("preloading_josie");
        handoffFrame.src = resolveJosieHandoffUrl().toString();
        interactionSfx?.setTrustedProxyWindow?.(handoffFrame.contentWindow);
      }

      function isTransitionWindowOpen() {
        if (!(introVideo instanceof HTMLVideoElement)) return false;
        if (!Number.isFinite(introVideo.duration) || introVideo.duration <= 0) return false;
        return introVideo.currentTime >= Math.max(0, introVideo.duration - handoffLeadSeconds);
      }

      function notifyIframeHandoffComplete() {
        try {
          handoffFrame?.contentWindow?.postMessage({ type: introCompleteMessageType }, window.location.origin);
        } catch {
        }
      }

      function syncIframeReadyFromDocument() {
        if (iframeReady || !(handoffFrame instanceof HTMLIFrameElement)) return iframeReady;
        try {
          const frameRoot = handoffFrame.contentDocument?.querySelector("#social-hub-root[data-social-hub-ready='true']");
          if (frameRoot) {
            iframeReady = true;
          }
        } catch {
        }
        return iframeReady;
      }

      function beginVisualHandoff() {
        if (handoffVisible || fallbackNavigationTriggered || !(handoffFrameWrap instanceof HTMLElement)) return;
        if (!syncIframeReadyFromDocument()) {
          setState("handoff_pending");
          return;
        }
        handoffVisible = true;
        setState("handoff_visible");
        interactionSfx?.setPage?.("josie");
        interactionSfx?.play?.({
          soundId: "open_soft",
          source: "introHandoffVisible"
        });
        updateTopLevelUrlForJosie();
        document.body.classList.add("is-handoff-visible");
        handoffFrameWrap.removeAttribute("aria-hidden");
      }

      function completeHandoff() {
        if (handoffCompleted || fallbackNavigationTriggered) return;
        if (!handoffVisible && iframeReady) {
          beginVisualHandoff();
        }
        if (!handoffVisible) {
          performFallbackNavigation();
          return;
        }
        handoffCompleted = true;
        setState("handoff_complete");
        interactionSfx?.setPage?.("josie");
        clearMonitorLoop();
        clearRepeatVisitTimer();
        clearIntroEndHandoffTimer();
        stopIntroAscii();
        document.body.classList.remove("is-handoff-visible");
        document.body.classList.add("is-handoff-complete");
        introVideo?.classList.add("is-hidden");
        introVideo?.setAttribute("aria-hidden", "true");
        if (introOverlay instanceof HTMLElement) {
          introOverlay.hidden = true;
        }
        if (introStartWrap instanceof HTMLElement) {
          introStartWrap.hidden = true;
        }
        notifyIframeHandoffComplete();
      }

      function performFallbackNavigation() {
        if (fallbackNavigationTriggered) return;
        fallbackNavigationTriggered = true;
        setState("handoff_fallback_navigation");
        clearMonitorLoop();
        clearRepeatVisitTimer();
        clearIntroEndHandoffTimer();
        stopIntroAscii();
        window.location.replace(resolveJosieDocumentUrl().toString());
      }

      function beginRepeatVisitHandoff() {
        if (!repeatVisitClickArmed || handoffCompleted || fallbackNavigationTriggered) return;
        if (!syncIframeReadyFromDocument()) {
          setState("handoff_pending");
          return;
        }
        beginVisualHandoff();
        if (repeatVisitHandoffTimer) return;
        repeatVisitHandoffTimer = window.setTimeout(() => {
          repeatVisitHandoffTimer = 0;
          completeHandoff();
        }, repeatVisitHandoffDelayMs);
      }

      function evaluateHandoffWindow() {
        if (!introStarted || handoffCompleted || fallbackNavigationTriggered) return;
        if (skipMovieMode) {
          stopIntroAscii();
          beginRepeatVisitHandoff();
          return;
        }
        syncIntroAsciiState();
        syncIframeReadyFromDocument();
        if (iframeReady && isTransitionWindowOpen()) {
          beginVisualHandoff();
        }
      }

      function syncHandoffProgress() {
        monitorRafId = 0;
        evaluateHandoffWindow();
        if (!handoffCompleted && !fallbackNavigationTriggered) {
          monitorRafId = window.requestAnimationFrame(syncHandoffProgress);
        }
      }

      function ensureMonitorLoop() {
        if (monitorRafId || handoffCompleted || fallbackNavigationTriggered) return;
        monitorRafId = window.requestAnimationFrame(syncHandoffProgress);
      }

      async function tryPlayIntro() {
        if (!(introVideo instanceof HTMLVideoElement)) return false;
        preloadJosieFrame();
        introStarted = true;
        if (skipMovieMode) {
          repeatVisitClickArmed = true;
          stopIntroAscii();
          beginRepeatVisitHandoff();
          return true;
        }
        introVideo.defaultMuted = false;
        introVideo.muted = false;
        try {
          await introVideo.play();
          markIntroAsSeen();
          setState("playing_intro");
          hideStartButton();
          ensureMonitorLoop();
          return true;
        } catch {
          introStarted = false;
          showStartButton();
          setState("idle");
          return false;
        }
      }

      if (!(introVideo instanceof HTMLVideoElement)) return;
      setState("idle");
      repeatVisitMode = hasSeenIntroBefore();
      skipMovieMode = repeatVisitMode || shouldSkipIntro();
      document.body.dataset.bloomToDeathRepeatVisit = repeatVisitMode ? "true" : "false";
      document.body.dataset.bloomToDeathSkipMovie = skipMovieMode ? "true" : "false";
      if (skipMovieMode) {
        introVideo.classList.add("is-hidden");
        introVideo.setAttribute("aria-hidden", "true");
        stopIntroAscii();
        preloadJosieFrame();
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        if (event.source !== handoffFrame?.contentWindow) return;
        const messageType = event.data && typeof event.data === "object" ? event.data.type : "";
        if (messageType !== introReadyMessageType) return;
        iframeReady = true;
        if (!handoffVisible && (introStarted || repeatVisitClickArmed)) {
          if (skipMovieMode) {
            beginRepeatVisitHandoff();
            return;
          }
          evaluateHandoffWindow();
          if (!handoffVisible && state !== "playing_intro") {
            setState("handoff_pending");
          }
        }
      });

      if (!skipMovieMode) {
        introVideo.src = introVideoPath;
        introVideo.load();
      }
      showStartButton();

      introVideo.addEventListener("loadeddata", () => {
        introVideo.classList.add("is-ready");
        configureIntroAsciiCanvas(true);
      }, { once: true });

      ["timeupdate", "seeked", "durationchange"].forEach((eventName) => {
        introVideo.addEventListener(eventName, () => {
          syncIntroAsciiState();
          evaluateHandoffWindow();
        });
      });

      introVideo.addEventListener("ended", () => {
        if (iframeReady) {
          beginVisualHandoff();
          clearIntroEndHandoffTimer();
          introEndHandoffTimer = window.setTimeout(() => {
            introEndHandoffTimer = 0;
            completeHandoff();
          }, introEndHandoffDelayMs);
          return;
        }
        stopIntroAscii();
        performFallbackNavigation();
      });
      window.addEventListener("resize", () => {
        configureIntroAsciiCanvas();
      });
      window.visualViewport?.addEventListener("resize", () => {
        configureIntroAsciiCanvas();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopIntroAscii();
        }
        if (!document.hidden && introStarted && introVideo.paused && !introVideo.ended) {
          void tryPlayIntro();
        }
        if (!document.hidden && introStarted) {
          syncIntroAsciiState();
        }
      });

      introStartButton?.addEventListener("click", () => {
        void interactionSfx?.initFromGesture?.("introStartButton");
        interactionSfx?.play?.({
          soundId: "activate_soft",
          source: "introStartButton"
        });
        void tryPlayIntro();
      });
    })();
  </script>
</body>
</html>
