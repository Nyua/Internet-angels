<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BloomToDeath</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="/fonts/OMORI_GAME2.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: "OmoriGame2";
      src: url("/fonts/OMORI_GAME2.ttf") format("truetype");
      font-display: block;
    }

    :root {
      --intro-bg: #000;
      --intro-fg: rgba(255, 255, 255, 0.92);
      --intro-border: rgba(255, 255, 255, 0.16);
      --intro-shadow: rgba(0, 0, 0, 0.48);
      --intro-card-bg: rgba(14, 14, 16, 0.72);
      --intro-card-border: rgba(255, 255, 255, 0.12);
      --intro-card-glow: rgba(255, 255, 255, 0.08);
      --intro-card-copy: rgba(255, 255, 255, 0.96);
      --handoff-fade-duration: 220ms;
      --handoff-wipe-duration: 860ms;
      --handoff-wipe-ease: cubic-bezier(0.82, 0, 0.18, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--intro-bg);
      color: var(--intro-fg);
    }

    body {
      position: relative;
      font-family: "Space Mono", "IBM Plex Mono", Consolas, Menlo, monospace;
    }

    .handoff-frame-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      clip-path: inset(0 100% 0 0);
      transition:
        clip-path var(--handoff-wipe-duration) var(--handoff-wipe-ease),
        opacity 1ms linear,
        visibility 0s linear var(--handoff-fade-duration);
      background: #000;
      will-change: clip-path;
    }

    .handoff-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .intro-video {
      position: fixed;
      left: 50%;
      top: 50%;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      background: #000;
      z-index: 3;
      opacity: 1;
      transform: translate(-50%, -50%);
      transition: opacity var(--handoff-fade-duration) ease;
    }

    .intro-video.is-ready {
      opacity: 1;
    }

    .intro-video.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .intro-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: 1;
      transition: opacity var(--handoff-fade-duration) ease;
      background: transparent;
    }

    .intro-start-wrap {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 5;
      clip-path: inset(0 0 0 0);
      transition:
        clip-path var(--handoff-wipe-duration) var(--handoff-wipe-ease),
        opacity var(--handoff-fade-duration) ease;
      will-change: clip-path;
    }

    .intro-start-wrap.is-visible {
      display: flex;
    }

    .intro-start-button {
      --intro-start-background-opacity: 0.2;
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      padding: 24px;
      background: #000;
      color: var(--intro-fg);
      box-shadow: none;
      cursor: pointer;
      overflow: hidden;
      isolation: isolate;
      text-align: center;
      place-items: center;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    .intro-start-button::before,
    .intro-start-button::after {
      content: "";
      position: absolute;
      inset: auto;
      display: none;
      pointer-events: none;
      z-index: -1;
    }

    .intro-start-button::before {
      inset: -4% -2%;
      background:
        radial-gradient(circle at 33% 58%, rgba(255, 255, 255, 0.11), transparent 24%),
        radial-gradient(circle at 66% 44%, rgba(255, 255, 255, 0.09), transparent 22%),
        radial-gradient(circle at 52% 70%, rgba(255, 255, 255, 0.07), transparent 20%);
      filter: blur(40px);
      opacity: var(--intro-start-background-opacity);
    }

    .intro-start-button::after {
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.04) 18%, rgba(255, 255, 255, 0)),
        radial-gradient(circle at 50% 32%, rgba(255, 255, 255, 0.16), transparent 40%);
      opacity: var(--intro-start-background-opacity);
    }

    .intro-start-button:hover,
    .intro-start-button:focus-visible {
      transform: none;
      box-shadow: none;
      outline: none;
    }

    .intro-start-button:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.68);
      outline-offset: -14px;
    }

    .intro-start-card-message {
      max-width: min(19ch, calc(100vw - 48px));
      color: var(--intro-card-copy);
      font:
        400
        clamp(34px, 4.2vw, 68px)
        / 0.92
        "OmoriGame2",
        "PixelMplus12",
        "Trebuchet MS",
        sans-serif;
      letter-spacing: 0;
      text-wrap: balance;
      overflow-wrap: break-word;
      text-shadow:
        0 0 1px rgba(255, 255, 255, 0.86),
        0 2px 0 rgba(0, 0, 0, 0.9);
      transition:
        opacity 220ms ease,
        transform 520ms var(--handoff-wipe-ease);
      will-change: opacity, transform;
    }

    @media (max-width: 640px) {
      .intro-start-button {
        padding: 24px;
      }

      .intro-video {
        width: 100vw;
        height: auto;
        max-width: 100vw;
        max-height: 100dvh;
      }
    }

    body.is-handoff-visible .handoff-frame-wrap,
    body.is-handoff-complete .handoff-frame-wrap {
      opacity: 1;
      visibility: visible;
      clip-path: inset(0 0 0 0);
      transition-delay: 0s;
    }

    body.is-handoff-complete .handoff-frame-wrap {
      pointer-events: auto;
    }

    body.is-handoff-visible .intro-video {
      opacity: 0.16;
    }

    body.is-handoff-visible .intro-overlay {
      opacity: 0.22;
    }

    body.is-intro-activated .intro-start-card-message {
      opacity: 0.62;
    }

    body.is-handoff-visible .intro-start-wrap {
      clip-path: inset(0 0 0 100%);
    }

    body.is-handoff-visible .intro-start-card-message,
    body.is-handoff-complete .intro-start-card-message {
      opacity: 0;
      transform: translateX(32px);
    }

    body.is-handoff-complete .intro-overlay,
    body.is-handoff-complete .intro-start-wrap {
      opacity: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --handoff-fade-duration: 1ms;
        --handoff-wipe-duration: 1ms;
      }

      .intro-start-card-message {
        transition-duration: 1ms;
      }
    }
  </style>
</head>
<body>
  <div id="handoffFrameWrap" class="handoff-frame-wrap" aria-hidden="true">
    <iframe
      id="handoffFrame"
      class="handoff-frame"
      title="Josie"
      loading="eager"
      allow="autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="same-origin"
    ></iframe>
  </div>
  <video id="introVideo" class="intro-video" playsinline preload="auto"></video>
  <div id="introOverlay" class="intro-overlay" aria-hidden="true"></div>
  <div id="introStartWrap" class="intro-start-wrap" aria-live="polite">
    <button
      id="introStartButton"
      class="intro-start-button"
      type="button"
      aria-label="Enter site. This user is a cat; therefore meow."
    >
      <span class="intro-start-card-message">This User is A cat; Therefore, Meow</span>
    </button>
  </div>

  <script src="/performance-tier.js?v=20260423-performance-2"></script>
  <script src="/interaction-sfx.js?v=20260329-josie-102"></script>
  <script>
    (() => {
      const handoffLeadSeconds = 2;
      const introWipeDurationMs = 860;
      const introEndHandoffDelayMs = introWipeDurationMs;
      const repeatVisitHandoffDelayMs = introWipeDurationMs;
      const defaultHandoffReadyTimeoutMs = 12_000;
      const introSeenStorageKey = "internetAngelBloomToDeathIntroSeen";
      const introVideoPath = "Timelapse/Wings.mp4";
      const bloomToDeathVideoEnabled = false;
      const introReadyMessageType = "josie-handoff-ready";
      const introCompleteMessageType = "josie-handoff-complete";
      const youtubeInlineActivationMessageType = "josie-youtube-inline-activation";
      const youtubeInlineActivationReadyMessageType = "josie-youtube-inline-activation-ready";
      const youtubeInlineActivationStorageKey = "internetAngelYoutubeInlineActivationAt";
      const introStartFallbackDelayMs = 2_800;
      const introVideo = document.getElementById("introVideo");
      const introOverlay = document.getElementById("introOverlay");
      const introStartWrap = document.getElementById("introStartWrap");
      const introStartButton = document.getElementById("introStartButton");
      const handoffFrameWrap = document.getElementById("handoffFrameWrap");
      const handoffFrame = document.getElementById("handoffFrame");
      const interactionSfx = window.__createInternetAngelInteractionSfx?.({
        page: "intro"
      }) || null;
      window.__internetAngelInteractionSfx = interactionSfx;
      let introStarted = false;
      let iframePreloading = false;
      let iframeReady = false;
      let handoffVisible = false;
      let handoffCompleted = false;
      let fallbackNavigationTriggered = false;
      let repeatVisitMode = false;
      let skipMovieMode = false;
      let repeatVisitClickArmed = false;
      let repeatVisitHandoffTimer = 0;
      let handoffReadyFallbackTimer = 0;
      let introEndHandoffTimer = 0;
      let introStartFallbackTimer = 0;
      let youtubeInlineActivationAt = 0;
      let state = "idle";
      let titleTypewriterTimer = 0;
      let titleTypewriterToken = 0;
      const titleTypewriterTimingScale = 2;
      const titleTypewriterStartDelayMs = 180 * titleTypewriterTimingScale;
      const titleTypewriterStepDelayMs = 95 * titleTypewriterTimingScale;
      const titleTypewriterHoldDelayMs = 900 * titleTypewriterTimingScale;
      const handoffReadyTimeoutMs = (() => {
        const override = Number(window.__internetAngelBootTimeoutMs);
        if (Number.isFinite(override) && override >= 0) {
          return override;
        }
        return defaultHandoffReadyTimeoutMs;
      })();
      let monitorRafId = 0;

      function startDocumentTitleTypewriter(finalTitle) {
        const safeTitle = String(finalTitle || "").trim();
        if (!safeTitle) return;
        const token = ++titleTypewriterToken;
        if (titleTypewriterTimer) {
          window.clearTimeout(titleTypewriterTimer);
          titleTypewriterTimer = 0;
        }
        window.__internetAngelTitleTypewriterDone = false;
        const schedule = (callback, delayMs) => {
          titleTypewriterTimer = window.setTimeout(() => {
            if (token !== titleTypewriterToken) return;
            callback();
          }, delayMs);
        };
        if (safeTitle === "BloomToDeath") {
          // Fall through to the same per-character typing behavior used elsewhere.
        }
        const chars = Array.from(safeTitle);
        let index = 0;
        const writeNext = () => {
          if (token !== titleTypewriterToken) return;
          if (index >= chars.length) {
            document.title = safeTitle;
            window.__internetAngelTitleTypewriterDone = true;
            schedule(() => {
              index = 0;
              document.title = "";
              schedule(writeNext, titleTypewriterStartDelayMs);
            }, titleTypewriterHoldDelayMs);
            return;
          }
          index += 1;
          document.title = chars.slice(0, index).join("");
          schedule(writeNext, titleTypewriterStepDelayMs);
        };
        document.title = "";
        schedule(writeNext, titleTypewriterStartDelayMs);
      }

      function setState(nextState) {
        state = nextState;
        window.__bloomToDeathState = nextState;
        document.body.dataset.bloomToDeathState = nextState;
      }

      function shouldSkipIntro() {
        return false;
      }

      function resolveJosieDisplayPath() {
        return "/josie";
      }

      function resolveJosieDocumentPath() {
        const isProductionDomain = /(^|\\.)internet-angel\\.net$/i.test(window.location.hostname);
        return isProductionDomain ? "/josie" : "/josie.html";
      }

      function resolveJosieUrl() {
        return new URL(resolveJosieDisplayPath(), window.location.origin);
      }

      function resolveJosieDocumentUrl() {
        return new URL(resolveJosieDocumentPath(), window.location.origin);
      }

      function resolveJosieHandoffUrl() {
        const url = resolveJosieDocumentUrl();
        url.searchParams.set("handoff", "1");
        return url;
      }

      function hasSeenIntroBefore() {
        try {
          return window.localStorage.getItem(introSeenStorageKey) === "1";
        } catch {
          return false;
        }
      }

      function markIntroAsSeen() {
        try {
          window.localStorage.setItem(introSeenStorageKey, "1");
        } catch {
        }
      }

      function clearMonitorLoop() {
        if (!monitorRafId) return;
        window.cancelAnimationFrame(monitorRafId);
        monitorRafId = 0;
      }

      function clearRepeatVisitTimer() {
        if (!repeatVisitHandoffTimer) return;
        window.clearTimeout(repeatVisitHandoffTimer);
        repeatVisitHandoffTimer = 0;
      }

      function clearHandoffReadyFallbackTimer() {
        if (!handoffReadyFallbackTimer) return;
        window.clearTimeout(handoffReadyFallbackTimer);
        handoffReadyFallbackTimer = 0;
      }

      function armHandoffReadyFallbackTimer() {
        if (handoffReadyFallbackTimer || handoffCompleted || fallbackNavigationTriggered || iframeReady) return;
        handoffReadyFallbackTimer = window.setTimeout(() => {
          handoffReadyFallbackTimer = 0;
          if (handoffCompleted || fallbackNavigationTriggered || iframeReady) return;
          performFallbackNavigation();
        }, handoffReadyTimeoutMs);
      }

      function clearIntroEndHandoffTimer() {
        if (!introEndHandoffTimer) return;
        window.clearTimeout(introEndHandoffTimer);
        introEndHandoffTimer = 0;
      }

      function shouldExpediteHandoff() {
        return skipMovieMode || repeatVisitClickArmed;
      }

      function showStartButton() {
        introStartWrap?.classList.add("is-visible");
      }

      function hideStartButton() {
        introStartWrap?.classList.remove("is-visible");
      }

      function clearIntroStartFallbackTimer() {
        if (!introStartFallbackTimer) return;
        window.clearTimeout(introStartFallbackTimer);
        introStartFallbackTimer = 0;
      }

      function showStartButtonWhenReady() {
        clearIntroStartFallbackTimer();
        showStartButton();
      }

      function armIntroStartFallbackTimer() {
        if (introStartFallbackTimer) return;
        introStartFallbackTimer = window.setTimeout(() => {
          introStartFallbackTimer = 0;
          showStartButton();
        }, introStartFallbackDelayMs);
      }

      function markIntroActivated() {
        document.body.classList.add("is-intro-activated");
      }

      function stopIntroPlayback() {
        if (!(introVideo instanceof HTMLVideoElement)) return;
        introVideo.pause();
        introVideo.muted = true;
        introVideo.defaultMuted = true;
      }

      function updateTopLevelUrlForJosie() {
        const url = resolveJosieUrl();
        window.history.replaceState({}, "", `${url.pathname}${url.search}${url.hash}`);
        startDocumentTitleTypewriter("Josie");
      }

      function preloadJosieFrame(options = {}) {
        if (!(handoffFrame instanceof HTMLIFrameElement)) return;
        const armFallback = options?.armFallback !== false;
        if (iframePreloading) {
          if (armFallback) {
            armHandoffReadyFallbackTimer();
          }
          return;
        }
        iframePreloading = true;
        setState("preloading_josie");
        handoffFrame.src = resolveJosieHandoffUrl().toString();
        interactionSfx?.setTrustedProxyWindow?.(handoffFrame.contentWindow);
        if (armFallback) {
          armHandoffReadyFallbackTimer();
        }
      }

      function postYouTubeInlineActivationToFrame() {
        if (!(handoffFrame instanceof HTMLIFrameElement) || !youtubeInlineActivationAt) return;
        try {
          handoffFrame.contentWindow?.postMessage({
            type: youtubeInlineActivationMessageType,
            activatedAt: youtubeInlineActivationAt,
            source: "intro-start-button"
          }, window.location.origin);
        } catch {
        }
      }

      function activateYouTubeInlinePlaybackInFrame() {
        if (!(handoffFrame instanceof HTMLIFrameElement) || !youtubeInlineActivationAt) return false;
        try {
          const frameWindow = handoffFrame.contentWindow;
          if (!frameWindow) return false;
          frameWindow.__internetAngelYouTubeInlineActivationAt = youtubeInlineActivationAt;
          const activate = frameWindow.__internetAngelActivateYouTubeInlinePlaybackFromParent;
          if (typeof activate !== "function") return false;
          activate({
            activatedAt: youtubeInlineActivationAt,
            source: "intro-start-button"
          });
          return true;
        } catch {
          return false;
        }
      }

      function rememberYouTubeInlineActivationGesture() {
        youtubeInlineActivationAt = Date.now();
        window.__internetAngelYouTubeInlineActivationAt = youtubeInlineActivationAt;
        try {
          window.sessionStorage?.setItem(youtubeInlineActivationStorageKey, String(youtubeInlineActivationAt));
        } catch {
        }
        activateYouTubeInlinePlaybackInFrame();
        postYouTubeInlineActivationToFrame();
      }

      function isTransitionWindowOpen() {
        if (!(introVideo instanceof HTMLVideoElement)) return false;
        if (!Number.isFinite(introVideo.duration) || introVideo.duration <= 0) return false;
        return introVideo.currentTime >= Math.max(0, introVideo.duration - handoffLeadSeconds);
      }

      function notifyIframeHandoffComplete() {
        try {
          handoffFrame?.contentWindow?.postMessage({ type: introCompleteMessageType }, window.location.origin);
        } catch {
        }
      }

      function syncIframeReadyFromDocument() {
        if (iframeReady || !(handoffFrame instanceof HTMLIFrameElement)) return iframeReady;
        try {
          const frameRoot = handoffFrame.contentDocument?.querySelector("#social-hub-root[data-social-hub-ready='true']");
          if (frameRoot) {
            iframeReady = true;
            clearHandoffReadyFallbackTimer();
          }
        } catch {
        }
        return iframeReady;
      }

      function beginVisualHandoff() {
        if (handoffVisible || fallbackNavigationTriggered || !(handoffFrameWrap instanceof HTMLElement)) return;
        if (!syncIframeReadyFromDocument()) {
          setState("handoff_pending");
          return;
        }
        handoffVisible = true;
        setState("handoff_visible");
        interactionSfx?.setPage?.("josie");
        updateTopLevelUrlForJosie();
        document.body.classList.add("is-handoff-visible");
        handoffFrameWrap.removeAttribute("aria-hidden");
      }

      function completeHandoff() {
        if (handoffCompleted || fallbackNavigationTriggered) return;
        if (!handoffVisible && iframeReady) {
          beginVisualHandoff();
        }
        if (!handoffVisible) {
          performFallbackNavigation();
          return;
        }
        handoffCompleted = true;
        setState("handoff_complete");
        interactionSfx?.setPage?.("josie");
        clearMonitorLoop();
        clearRepeatVisitTimer();
        clearHandoffReadyFallbackTimer();
        clearIntroEndHandoffTimer();
        clearIntroStartFallbackTimer();
        stopIntroPlayback();
        document.body.classList.remove("is-handoff-visible");
        document.body.classList.add("is-handoff-complete");
        introVideo?.classList.add("is-hidden");
        introVideo?.setAttribute("aria-hidden", "true");
        if (introOverlay instanceof HTMLElement) {
          introOverlay.hidden = true;
        }
        if (introStartWrap instanceof HTMLElement) {
          introStartWrap.hidden = true;
        }
        notifyIframeHandoffComplete();
      }

      function performFallbackNavigation() {
        if (fallbackNavigationTriggered) return;
        fallbackNavigationTriggered = true;
        setState("handoff_fallback_navigation");
        clearMonitorLoop();
        clearRepeatVisitTimer();
        clearHandoffReadyFallbackTimer();
        clearIntroEndHandoffTimer();
        clearIntroStartFallbackTimer();
        stopIntroPlayback();
        window.location.replace(resolveJosieDocumentUrl().toString());
      }

      function beginRepeatVisitHandoff() {
        if (!repeatVisitClickArmed || handoffCompleted || fallbackNavigationTriggered) return;
        if (!syncIframeReadyFromDocument()) {
          setState("handoff_pending");
          return;
        }
        beginVisualHandoff();
        if (repeatVisitHandoffTimer) return;
        repeatVisitHandoffTimer = window.setTimeout(() => {
          repeatVisitHandoffTimer = 0;
          completeHandoff();
        }, repeatVisitHandoffDelayMs);
      }

      function evaluateHandoffWindow() {
        if (!introStarted || handoffCompleted || fallbackNavigationTriggered) return;
        if (shouldExpediteHandoff()) {
          beginRepeatVisitHandoff();
          return;
        }
        syncIframeReadyFromDocument();
        if (iframeReady && isTransitionWindowOpen()) {
          beginVisualHandoff();
        }
      }

      function syncHandoffProgress() {
        monitorRafId = 0;
        evaluateHandoffWindow();
        if (!handoffCompleted && !fallbackNavigationTriggered) {
          monitorRafId = window.requestAnimationFrame(syncHandoffProgress);
        }
      }

      function ensureMonitorLoop() {
        if (monitorRafId || handoffCompleted || fallbackNavigationTriggered) return;
        monitorRafId = window.requestAnimationFrame(syncHandoffProgress);
      }

      async function tryPlayIntro() {
        if (!(introVideo instanceof HTMLVideoElement)) return false;
        preloadJosieFrame();
        introStarted = true;
        if (skipMovieMode) {
          stopIntroPlayback();
          repeatVisitClickArmed = true;
          beginRepeatVisitHandoff();
          return true;
        }
        introVideo.defaultMuted = false;
        introVideo.muted = false;
        try {
          await introVideo.play();
          markIntroAsSeen();
          setState("playing_intro");
          hideStartButton();
          ensureMonitorLoop();
          return true;
        } catch {
          introStarted = false;
          showStartButton();
          setState("idle");
          return false;
        }
      }

      function requestIntroSkip() {
        if (!introStarted || handoffCompleted || fallbackNavigationTriggered) return;
        if (state !== "playing_intro" && state !== "handoff_pending" && state !== "handoff_visible") return;
        repeatVisitClickArmed = true;
        stopIntroPlayback();
        if (handoffVisible) {
          completeHandoff();
          return;
        }
        beginRepeatVisitHandoff();
        ensureMonitorLoop();
      }

      if (!(introVideo instanceof HTMLVideoElement)) return;
      startDocumentTitleTypewriter("BloomToDeath");
      setState("idle");
      repeatVisitMode = false;
      skipMovieMode = !bloomToDeathVideoEnabled || shouldSkipIntro();
      document.body.dataset.bloomToDeathRepeatVisit = "false";
      document.body.dataset.bloomToDeathSkipMovie = String(skipMovieMode);
      document.body.dataset.bloomToDeathVideoEnabled = String(bloomToDeathVideoEnabled);
      if (skipMovieMode) {
        introVideo.removeAttribute("src");
        introVideo.classList.add("is-hidden");
        introVideo.setAttribute("aria-hidden", "true");
        introVideo.load?.();
        preloadJosieFrame({ armFallback: false });
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        if (event.source !== handoffFrame?.contentWindow) return;
        const messageType = event.data && typeof event.data === "object" ? event.data.type : "";
        if (messageType === youtubeInlineActivationReadyMessageType) {
          showStartButtonWhenReady();
          activateYouTubeInlinePlaybackInFrame();
          postYouTubeInlineActivationToFrame();
          return;
        }
        if (messageType !== introReadyMessageType) return;
        iframeReady = true;
        clearHandoffReadyFallbackTimer();
        activateYouTubeInlinePlaybackInFrame();
        postYouTubeInlineActivationToFrame();
        if (!handoffVisible && (introStarted || repeatVisitClickArmed)) {
          if (shouldExpediteHandoff()) {
            beginRepeatVisitHandoff();
            return;
          }
          evaluateHandoffWindow();
          if (!handoffVisible && state !== "playing_intro") {
            setState("handoff_pending");
          }
        }
      });

      if (!skipMovieMode) {
        introVideo.src = introVideoPath;
        introVideo.load();
      }
      if (skipMovieMode) {
        armIntroStartFallbackTimer();
      } else {
        showStartButton();
      }
      window.__internetAngelPerformanceState?.markReady?.();

      introVideo.addEventListener("loadeddata", () => {
        introVideo.classList.add("is-ready");
      }, { once: true });

      ["timeupdate", "seeked", "durationchange"].forEach((eventName) => {
        introVideo.addEventListener(eventName, () => {
          evaluateHandoffWindow();
        });
      });

      introVideo.addEventListener("ended", () => {
        if (iframeReady) {
          beginVisualHandoff();
          clearIntroEndHandoffTimer();
          introEndHandoffTimer = window.setTimeout(() => {
            introEndHandoffTimer = 0;
            completeHandoff();
          }, introEndHandoffDelayMs);
          return;
        }
        performFallbackNavigation();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && introStarted && introVideo.paused && !introVideo.ended && !shouldExpediteHandoff()) {
          void tryPlayIntro();
        }
      });
      document.addEventListener("click", (event) => {
        if (event instanceof MouseEvent && event.button !== 0) return;
        if (event.target instanceof Element && event.target.closest("#introStartButton")) return;
        requestIntroSkip();
      });

      introStartButton?.addEventListener("click", () => {
        markIntroActivated();
        rememberYouTubeInlineActivationGesture();
        void interactionSfx?.initFromGesture?.("introStartButton");
        void tryPlayIntro();
      });
    })();
  </script>
</body>
</html>
