        if (!handoffMode) return;

        const handoffReadyMessageType = "josie-handoff-ready";
        const handoffCompleteMessageType = "josie-handoff-complete";
        let readyPosted = false;

        function isSameOriginParentMessage(event) {
          return event.origin === window.location.origin && event.source === window.parent;
        }

        function unlockHandoffPlayback() {
          if (!window.__josieHandoffPending) return;
          window.__josieHandoffPending = false;
          window.__amesSiteLoadPlaying = false;
          if (!window.__amesSiteLoadComplete) {
            window.__amesSiteLoadComplete = true;
            window.dispatchEvent(new CustomEvent(SITE_LOAD_COMPLETE_EVENT));
          }
        }

        function postReadyToParent() {
          if (readyPosted || window.parent === window) return;
          readyPosted = true;
          try {
            window.parent.postMessage({ type: handoffReadyMessageType }, window.location.origin);
          } catch {
          }
        }

        function waitForSocialHubReady() {
          const root = document.querySelector("#social-hub-root");
          if (root instanceof HTMLElement && root.getAttribute("data-social-hub-ready") === "true") {
            postReadyToParent();
            return;
          }
          const observer = new MutationObserver(() => {
            const nextRoot = document.querySelector("#social-hub-root");
            if (!(nextRoot instanceof HTMLElement)) return;
            if (nextRoot.getAttribute("data-social-hub-ready") !== "true") return;
            observer.disconnect();
            postReadyToParent();
          });
          if (document.body instanceof HTMLElement) {
            observer.observe(document.body, {
              subtree: true,
              childList: true,
              attributes: true,
              attributeFilter: ["data-social-hub-ready"]
            });
          }
        }

        window.addEventListener("message", (event) => {
          if (!isSameOriginParentMessage(event)) return;
          const messageType = event.data && typeof event.data === "object" ? event.data.type : "";

          root.style.removeProperty("margin");

          if (window.innerWidth <= breakpointPx) {

          })();

          decodedSliceCache.set(url, decodePromise);
          return decodePromise;
        }

        async function waitForCondition(check, timeoutMs = 45000) {
          const start = performance.now();
          while (performance.now() - start < timeoutMs) {
            const value = check();
            if (value) return value;
            await sleep(80);
          }
          return null;
        }

        async function resolveHosts() {
          const entries = await Promise.all(
            Object.entries(hostSelectors).map(async ([key, selector]) => {
              const element = await waitForCondition(() => document.querySelector(selector));
              return [key, element];
            })
          );
          const hosts = Object.fromEntries(entries);
          for (const key of Object.keys(hostSelectors)) {
            if (!hosts[key]) {
              throw new Error(`Missing host element: ${key}`);
            }
          }
          return hosts;
        }

        function createSliceLayer({ key, hostSelector, decoded, rectResolver, sourcePath }) {
          const layer = document.createElement("div");
          layer.className = "slice-boot-layer";
          layer.dataset.sliceBootKey = key;
          layer.dataset.sliceBootSource = sourcePath || "";
          ensureOverlayRoot().append(layer);

          const frames = decoded.frames;
          const delays = decoded.frameDelaysMs;
          const frameCount = frames.length;
          const baseIndices = Array.from({ length: frameCount }, (_, index) => index);
          const sequenceIndices = baseIndices.slice();
          const sequenceDurations = delays.slice();

          const cumulativeMs = [];
          let totalSequenceMs = 0;
          for (const duration of sequenceDurations) {
            totalSequenceMs += Math.max(16, duration || targetFrameMs);
            cumulativeMs.push(totalSequenceMs);
          }

          let currentHost = null;
          let startedAt = 0;
          let cursor = 0;
          let done = frameCount === 0;

          function renderInto(ts, targetCtx) {
            if (done) return false;
            if (!currentHost || !currentHost.isConnected) {
              currentHost = document.querySelector(hostSelector);
            }
            if (!currentHost) return false;

            const hostRect = currentHost.getBoundingClientRect();
            const rect = rectResolver ? rectResolver(hostRect, currentHost) : hostRect;
            const widthPx = Math.max(2, Math.round(rect.width));
            const heightPx = Math.max(2, Math.round(rect.height));
            if (widthPx <= 2 || heightPx <= 2) return false;

            layer.style.display = "block";
            layer.style.left = `${Math.round(rect.left)}px`;
            layer.style.top = `${Math.round(rect.top)}px`;
            layer.style.width = `${widthPx}px`;
            layer.style.height = `${heightPx}px`;

            if (!startedAt) startedAt = ts;
            const elapsed = ts - startedAt;
            if (elapsed >= totalSequenceMs) {
              done = true;
              layer.style.display = "none";
              return false;
            }

            while (cursor < cumulativeMs.length - 1 && elapsed >= cumulativeMs[cursor]) {
              cursor += 1;
            }

            const frameIndex = sequenceIndices[cursor] ?? frameCount - 1;
            const frame = frames[frameIndex];
            if (!frame) return false;

            const drawX = Math.round((Math.round(rect.left) / viewportW) * cols);
            const drawY = Math.round((Math.round(rect.top) / viewportH) * rows);
            const drawW = Math.max(1, Math.round((widthPx / viewportW) * cols));
            const drawH = Math.max(1, Math.round((heightPx / viewportH) * rows));
            targetCtx.drawImage(frame, drawX, drawY, drawW, drawH);
            return true;
          }

          function isDone() {
            return done;
          }

          function destroy() {
            layer.remove();
          }

          return { renderInto, isDone, destroy };
        }

        function renderAsciiFromSample() {
          if (!asciiCtx) return;
          const frame = sampleCtx.getImageData(0, 0, cols, rows);
          const data = frame.data;
          const size = cols * rows;
          const lum = new Float32Array(size);
          const alpha = new Uint8Array(size);
          for (let i = 0, p = 0; i < size; i += 1, p += 4) {
            const r = data[p];
            const g = data[p + 1];
            const b = data[p + 2];
            const a = data[p + 3];
            alpha[i] = a;
            let y = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
            y = clamp01((y - 0.5) * 1.45 + 0.5);
            y = Math.pow(y, 0.92);
            lum[i] = y;
          }

          asciiCtx.clearRect(0, 0, viewportW, viewportH);
          asciiCtx.globalAlpha = 1;
          asciiCtx.font = `700 ${Math.round(cellSize * glyphScale)}px "Space Mono", "IBM Plex Mono", Consolas, Menlo, monospace`;

          const densityMax = chars.length - 1;
          const edgeStrength = 0.68;
          const ditherStrength = 0.08;
          let lastFillStyle = "";
          for (let y = 0; y < rows; y += 1) {
            const yBase = y * cols;
            const py = y * cellH;
            for (let x = 0; x < cols; x += 1) {
              const idx = yBase + x;
              if (alpha[idx] < 8) continue;
              const l = lum[idx];
              const left = x > 0 ? lum[idx - 1] : l;
              const right = x < cols - 1 ? lum[idx + 1] : l;
              const up = y > 0 ? lum[idx - cols] : l;
              const down = y < rows - 1 ? lum[idx + cols] : l;
              const edge = Math.hypot(right - left, down - up);
              const dither = (bayer4[y & 3][x & 3] / 15 - 0.5) * ditherStrength;
              const signal = clamp01(l * 0.9 + edge * edgeStrength + 0.08 + dither);
              const charIndex = Math.min(densityMax, Math.max(0, Math.floor(signal * densityMax)));
              const ch = chars[charIndex];
              if (ch !== " ") {
                const pixelIndex = idx * 4;
                const alphaScale = alpha[idx] / 255;
                const fillStyle = getGlyphFillStyle(
                  Math.round(data[pixelIndex] * alphaScale),
                  Math.round(data[pixelIndex + 1] * alphaScale),
                  Math.round(data[pixelIndex + 2] * alphaScale)
                );
                if (fillStyle !== lastFillStyle) {
                  asciiCtx.fillStyle = fillStyle;
                  lastFillStyle = fillStyle;
                }
                asciiCtx.fillText(ch, x * cellW, py);
              }
            }
          }
        }

        function stopSequence() {
          if (loopHandle) {
            window.cancelAnimationFrame(loopHandle);
            loopHandle = 0;
          }
          for (const layer of activeLayers.splice(0, activeLayers.length)) {
            layer.destroy();
          }
          if (asciiCtx) {
            asciiCtx.clearRect(0, 0, viewportW, viewportH);
          }
          cleanupOverlayRoot();
          setSiteLoadPlaying(false);
        }

        function renderLoop(ts) {
          if (!activeLayers.length) {
            stopSequence();
            return;
          }

          loopHandle = window.requestAnimationFrame(renderLoop);
          if (document.hidden) return;

          configureAsciiCanvas();
          if (!viewportW || !viewportH || !cols || !rows) return;

          sampleCtx.clearRect(0, 0, cols, rows);
          let drewAny = false;
          for (const layer of activeLayers) {
            drewAny = layer.renderInto(ts, sampleCtx) || drewAny;
          }

          if (drewAny) {
            renderAsciiFromSample();
          } else if (asciiCtx) {
            asciiCtx.clearRect(0, 0, viewportW, viewportH);
          }

          if (activeLayers.every((layer) => layer.isDone())) {
            stopSequence();
          }
        }

        function startRenderLoop() {
          if (loopHandle) return;
          loopHandle = window.requestAnimationFrame(renderLoop);
        }

        async function runSliceBootSequence() {
          const socialHubReady = await waitForCondition(() => {
            const root = document.querySelector("#social-hub-root");
            return root && root.getAttribute("data-social-hub-ready") === "true";
          });
          if (!socialHubReady) {
            setSiteLoadPlaying(false);
            return;
          }

          await resolveHosts();
          ensureOverlayRoot();

          const decodedEntries = await Promise.all(
            sliceOrder.map(async (key) => [key, await decodeGifFrames(slicePaths[key])])
          );
          const decodedByKey = Object.fromEntries(decodedEntries);

          for (const key of sliceOrder) {
            activeLayers.push(
              createSliceLayer({
                key,
                hostSelector: hostSelectors[key],
                decoded: decodedByKey[key],
                rectResolver: sliceRectResolvers[key] || null,
                sourcePath: slicePaths[key]
              })
            );
          }

          configureAsciiCanvas(true);
          startRenderLoop();
        }

        function startSequence() {
          const viewportWidth = Math.min(
            window.innerWidth || Number.POSITIVE_INFINITY,
            window.visualViewport?.width || Number.POSITIVE_INFINITY
          );
          if (viewportWidth <= compactMobileBreakpointPx) {
            setSiteLoadPlaying(false);
            return;
          }
          setSiteLoadPlaying(true);
          void runSliceBootSequence().catch(() => {
            setSiteLoadPlaying(false);
          });
        }

        window.addEventListener("resize", () => configureAsciiCanvas());
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", () => configureAsciiCanvas());
        }

        if (document.readyState === "complete") {
          startSequence();
        } else {
          window.addEventListener("load", startSequence, { once: true });
        }
      })();
    </script>
  </body>
</html>
